<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Quantity Measurement</title>

  <link rel="stylesheet" href="css/style.css">

  <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<div class="container">

  <!-- ================= HEADER ================= -->

  <header>

    <h1>Welcome To Quantity Measurement</h1>

    <p>
      Measure • Compare • Convert • Calculate
    </p>

  </header>


  <!-- ================= MEASUREMENT ================= -->

  <section class="measurement-section">

    <h2>Select Measurement Type</h2>

    <div class="type-container">

      <div class="type-card active"
           id="lengthCard">

        <div class="icon">📏</div>

        <h3>Length</h3>

      </div>


      <div class="type-card"
           id="weightCard">

        <div class="icon">⚖️</div>

        <h3>Weight</h3>

      </div>


      <div class="type-card"
           id="temperatureCard">

        <div class="icon">🌡️</div>

        <h3>Temperature</h3>

      </div>


      <div class="type-card"
           id="volumeCard">

        <div class="icon">🪣</div>

        <h3>Volume</h3>

      </div>

    </div>

  </section>



  <!-- ================= OPERATIONS ================= -->

  <section class="operation-section">

    <h2>Select Operation</h2>

    <div class="action-container">

      <button
              class="action-btn active-action"
              id="compareBtn">

        Compare

      </button>


      <button
              class="action-btn"
              id="convertBtn">

        Convert

      </button>


      <button
              class="action-btn"
              id="addBtn">

        Add

      </button>


      <button
              class="action-btn"
              id="subtractBtn">

        Subtract

      </button>


      <button
              class="action-btn"
              id="divideBtn">

        Divide

      </button>

    </div>

  </section>



  <!-- ================= INPUTS ================= -->

  <section class="input-section">

    <div class="input-box">

      <label id="label1">

        VALUE 1

      </label>

      <input

              type="number"

              id="value1"

              placeholder="Enter Value">

      <select id="unit1"></select>

    </div>


    <div class="input-box">

      <label id="label2">

        VALUE 2

      </label>

      <input

              type="number"

              id="value2"

              placeholder="Enter Value">

      <select id="unit2"></select>

    </div>


    <div class="input-box">

      <label>

        TARGET UNIT

      </label>

      <select id="targetUnit">

      </select>

    </div>

  </section>



  <!-- ================= VALIDATION ================= -->

  <section>

    <p id="errorMessage">

    </p>

  </section>



  <!-- ================= EXECUTE ================= -->

  <section class="execute-section">

    <button id="executeBtn">

      Execute

    </button>

  </section>



  <!-- ================= RESULT ================= -->

  <section class="result-section">

    <h2>Result</h2>

    <div id="result">

      Waiting for Operation...

    </div>

  </section>



  <!-- ================= IFRAME ================= -->

  <section class="iframe-section">

    <h2>

      Help

    </h2>

    <iframe

            src="help.html"

            width="100%"

            height="250">

    </iframe>

  </section>

</div>


<script src="js/validation.js"></script>

<script src="js/app.js"></script>

</body>

</html>
